<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#8 AEP film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Source for the #8 AEP marketing film (light edition). Every frame is a pure function of time:
   seek(t) renders the frame at t seconds, so film/render.js can export it frame by frame. */
:root {
  --bg: #F5F4F0; --ink: #0B0C10; --mu: #6B7080; --card: #FFFFFF; --line: rgba(11,12,16,.08);
  --sig: #4F6BFF; --ion: #13A88B; --emb: #EE7433; --vio: #9B5CF0; --sun: #E0A21B;
  --sh: 0 1px 0 rgba(11,12,16,.04), 0 1px 2px rgba(11,12,16,.04), 0 30px 60px -34px rgba(11,12,16,.28);
  --font: 'Inter Tight', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #E9E7E1; overflow: hidden; }
body { font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; display: grid; place-items: center; }
#stage { position: relative; width: 1920px; height: 1080px; flex: none; overflow: hidden; color: var(--ink);
  background: radial-gradient(1100px 700px at 85% 0%, rgba(79,107,255,.13), transparent 60%), radial-gradient(900px 600px at 0% 100%, rgba(19,168,139,.10), transparent 60%), radial-gradient(700px 500px at 60% 110%, rgba(238,116,51,.07), transparent 60%), var(--bg); }
.scene { position: absolute; inset: 0; visibility: hidden; }
.grad { background: linear-gradient(100deg, #4F6BFF, #13A88B 55%, #EE7433); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo { fill: var(--ink); color: var(--ink); }
.center { display: grid; place-items: center; align-content: center; text-align: center; gap: 26px; }
.big { font-size: 128px; line-height: .95; letter-spacing: -0.058em; font-weight: 700; }
.lede { font-size: 32px; color: var(--mu); }

/* Captions */
.cap { position: absolute; left: 160px; top: 62px; width: 1600px; display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; }
.cap span { display: block; font-size: 22px; font-weight: 600; color: var(--sig); margin-bottom: 10px; }
.cap h2 { font-size: 66px; line-height: 1; letter-spacing: -0.045em; font-weight: 700; white-space: nowrap; }
.cap p { font-size: 26px; color: var(--mu); max-width: 700px; text-align: right; line-height: 1.35; }

/* Window chrome */
.win { position: absolute; left: 160px; top: 232px; width: 1600px; height: 800px; border-radius: 30px; overflow: hidden; background: rgba(255,255,255,.72);
  backdrop-filter: blur(20px); box-shadow: 0 0 0 1px rgba(11,12,16,.07), 0 60px 120px -50px rgba(11,12,16,.35), 0 0 120px -60px var(--c, #4F6BFF); }
.bar { height: 56px; display: flex; align-items: center; gap: 9px; padding: 0 22px; border-bottom: 1px solid var(--line); font-size: 16px; background: rgba(255,255,255,.7); }
.bar > i { width: 12px; height: 12px; border-radius: 50%; background: rgba(11,12,16,.12); }
.bar em { font-style: normal; color: var(--mu); margin-left: 12px; }
.bar b { margin-left: auto; font-size: 14px; font-weight: 600; padding: 6px 14px; border-radius: 999px; background: rgba(11,12,16,.06); color: var(--mu); }
.bar b.live { background: var(--ion); color: #fff; }

/* Dashboard chrome */
.dash { position: absolute; left: 160px; top: 232px; width: 1600px; height: 800px; border-radius: 30px; overflow: hidden; display: grid; grid-template-columns: 84px 1fr;
  background: #FBFAF8; box-shadow: 0 0 0 1px rgba(11,12,16,.07), 0 60px 120px -50px rgba(11,12,16,.35), 0 0 140px -60px var(--c); }
.nav { border-right: 1px solid var(--line); display: grid; align-content: start; justify-items: center; gap: 18px; padding-top: 24px; background: #fff; }
.nav b { width: 44px; height: 44px; border-radius: 14px; background: var(--c); display: grid; place-items: center; font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 14px; }
.nav i { width: 26px; height: 26px; border-radius: 8px; background: rgba(11,12,16,.07); }
.nav i.on { background: var(--c); opacity: .9; }
.dm { display: grid; grid-template-rows: 70px 124px 1fr; min-width: 0; }
.top { display: flex; align-items: center; gap: 16px; padding: 0 28px; border-bottom: 1px solid var(--line); background: #fff; }
.top b { font-size: 24px; letter-spacing: -0.02em; }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--ion); padding: 6px 12px; border-radius: 999px; background: rgba(19,168,139,.1); }
.live i { width: 9px; height: 9px; border-radius: 50%; background: var(--ion); box-shadow: 0 0 10px var(--ion); }
.top small { margin-left: auto; font-size: 16px; color: var(--mu); }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; padding: 18px 28px 0; }
.kpi { padding: 16px 20px; border-radius: 18px; background: #fff; box-shadow: var(--sh); }
.kpi span { font-size: 15px; color: var(--mu); }
.kpi b { display: block; font-size: 40px; font-weight: 700; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; margin-top: 4px; line-height: 1.05; }
.kpi b em { font-style: normal; font-size: 18px; color: var(--mu); margin-left: 4px; font-weight: 500; letter-spacing: 0; }
.body { padding: 18px 28px 28px; display: grid; gap: 16px; min-height: 0; position: relative; }
.card { border-radius: 20px; background: #fff; box-shadow: var(--sh); padding: 18px 20px; position: relative; overflow: hidden; min-height: 0; }
.card h4 { font-size: 16px; color: var(--mu); font-weight: 600; margin-bottom: 10px; }
.toast { position: absolute; display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-radius: 16px; font-size: 18px; font-weight: 600; visibility: hidden; z-index: 5;
  background: #fff; box-shadow: inset 0 0 0 1.5px rgba(238,116,51,.55), 0 24px 50px -16px rgba(11,12,16,.35); }
.toast i { width: 12px; height: 12px; border-radius: 50%; background: var(--emb); box-shadow: 0 0 12px var(--emb); flex: none; }
.toast.ok { box-shadow: inset 0 0 0 1.5px rgba(19,168,139,.55), 0 24px 50px -16px rgba(11,12,16,.35); }
.toast.ok i { background: var(--ion); box-shadow: 0 0 12px var(--ion); }
.row { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); font-size: 17px; }
.row:last-child { border-bottom: 0; }
.pill { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: rgba(19,168,139,.12); color: var(--ion); }
.pill.warn { background: rgba(238,116,51,.13); color: var(--emb); }
.pill.idle { background: rgba(11,12,16,.06); color: var(--mu); }
.num { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 90px; text-align: right; }

/* Builder */
.bld { display: grid; grid-template-columns: 290px 1fr 440px; height: 744px; }
.rail { border-right: 1px solid var(--line); padding: 24px 18px; display: grid; align-content: start; gap: 6px; background: rgba(255,255,255,.6); }
.rail li { list-style: none; display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: center; padding: 13px 12px; border-radius: 16px; color: var(--mu); }
.rail li span { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 600; box-shadow: inset 0 0 0 1.5px rgba(11,12,16,.16); background: #fff; }
.rail li b { font-size: 19px; font-weight: 600; }
.rail li.on { background: rgba(79,107,255,.1); color: var(--ink); }
.rail li.on span { background: var(--sig); color: #fff; box-shadow: 0 0 0 5px rgba(79,107,255,.18); }
.rail li.done { color: var(--ink); }
.rail li.done span { background: var(--ion); color: #fff; box-shadow: none; }
.main { position: relative; }
.panel { position: absolute; inset: 0; padding: 32px 36px; display: grid; align-content: start; gap: 18px; visibility: hidden; }
.ph { font-size: 34px; letter-spacing: -0.035em; font-weight: 700; }
.phs { font-size: 18px; color: var(--mu); margin-top: -10px; }
.ocg { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.oc { position: relative; display: grid; grid-template-columns: 52px 1fr; gap: 4px 16px; align-items: center; padding: 20px 56px 20px 20px; border-radius: 20px; background: #fff; box-shadow: var(--sh); }
.oc .ic { grid-row: span 2; width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; background: rgba(11,12,16,.05); color: var(--ink); }
.oc .ic svg { width: 26px; height: 26px; }
.oc b { font-size: 19px; font-weight: 600; line-height: 1.25; }
.oc small { font-size: 15px; color: var(--mu); }
.oc .tick { position: absolute; top: 16px; right: 16px; width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(11,12,16,.2); display: grid; place-items: center; color: #fff; font-size: 14px; font-weight: 800; }
.oc.on { box-shadow: inset 0 0 0 2px var(--sig), 0 20px 40px -24px rgba(79,107,255,.6); }
.oc.on .ic { background: var(--sig); color: #fff; }
.oc.on .tick { background: var(--sig); box-shadow: none; }
.bp { display: grid; gap: 8px; }
.bp li { list-style: none; display: grid; grid-template-columns: 40px 1fr auto; gap: 16px; align-items: center; padding: 13px 20px; border-radius: 16px; background: rgba(255,255,255,.55); }
.bp li.on { background: #fff; box-shadow: var(--sh); }
.bp .no { font-size: 15px; color: var(--mu); }
.bp b { font-size: 19px; font-weight: 600; color: var(--mu); }
.bp li.on b { color: var(--ink); }
.sw { width: 56px; height: 32px; border-radius: 999px; background: rgba(11,12,16,.12); position: relative; display: block; }
.sw i { position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(11,12,16,.25); }
.dv { display: grid; grid-template-columns: 96px 1fr auto; gap: 18px; align-items: center; padding: 14px; border-radius: 20px; background: #fff; box-shadow: var(--sh); visibility: hidden; }
.dv .art { height: 76px; border-radius: 14px; display: grid; place-items: center; background: radial-gradient(90% 90% at 50% 0%, color-mix(in srgb, var(--h) 22%, transparent), transparent 75%), #F6F6F3; color: var(--h); }
.dv .art svg { width: 40px; height: 40px; }
.dv b { font-size: 20px; font-weight: 600; display: block; }
.dv small { display: block; font-size: 15px; color: var(--mu); margin-top: 3px; }
.added { font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 999px; background: rgba(19,168,139,.12); color: var(--ion); white-space: nowrap; }
.obar { padding: 18px 20px; border-radius: 20px; background: #fff; box-shadow: var(--sh); display: grid; gap: 12px; }
.obar div { display: flex; justify-content: space-between; font-size: 18px; font-weight: 600; }
.obar div em { font-style: normal; color: var(--ion); font-variant-numeric: tabular-nums; }
.track { height: 10px; border-radius: 10px; background: rgba(11,12,16,.07); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--sig), var(--ion)); }
.flowc { position: relative; height: 420px; border-radius: 22px; background: #fff; box-shadow: var(--sh);
  background-image: radial-gradient(rgba(11,12,16,.08) 1px, transparent 1px); background-size: 22px 22px; }
.fn { position: absolute; width: 230px; padding: 16px 18px; border-radius: 18px; background: #fff; box-shadow: 0 0 0 1.5px rgba(11,12,16,.1), 0 16px 30px -18px rgba(11,12,16,.35); display: grid; gap: 4px; }
.fn small { font-size: 13px; font-weight: 700; color: var(--mu); text-transform: none; }
.fn b { font-size: 19px; font-weight: 650; }
.fn.lit { box-shadow: 0 0 0 2.5px var(--k), 0 20px 40px -18px var(--k); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 28px; }
.f { display: grid; gap: 12px; }
.f > span { font-size: 16px; font-weight: 600; color: var(--mu); }
.inp { height: 58px; display: flex; align-items: center; padding: 0 20px; border-radius: 14px; background: #fff; box-shadow: inset 0 0 0 1.5px rgba(11,12,16,.12); font-size: 21px; }
.inp.focus { box-shadow: inset 0 0 0 2px var(--sig), 0 0 0 5px rgba(79,107,255,.14); }
.caret { display: inline-block; width: 2px; height: 26px; background: var(--ink); margin-left: 2px; }
.sws { display: flex; gap: 12px; }
.sws i { width: 42px; height: 42px; border-radius: 50%; box-shadow: 0 0 0 3px #fff, 0 0 0 4px rgba(11,12,16,.08); }
.sws i.on { box-shadow: 0 0 0 3px #fff, 0 0 0 6px currentColor; }
.seg { display: inline-flex; gap: 4px; padding: 5px; border-radius: 999px; background: rgba(11,12,16,.06); justify-self: start; }
.seg i { font-style: normal; padding: 11px 22px; border-radius: 999px; font-size: 17px; color: var(--mu); }
.seg i.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 4px 10px -4px rgba(11,12,16,.25); }
.ok { display: flex; align-items: center; gap: 10px; color: var(--ion); font-weight: 700; font-size: 19px; }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 58px; padding: 0 32px; border-radius: 999px; background: var(--sig); color: #fff; font-size: 20px; font-weight: 650; justify-self: start; box-shadow: 0 16px 34px -14px var(--sig); }
.log { display: grid; gap: 11px; padding: 20px 22px; border-radius: 20px; background: #fff; box-shadow: var(--sh); font-size: 18px; }
.log li { list-style: none; display: flex; align-items: center; gap: 14px; visibility: hidden; }
.log li i { width: 18px; height: 18px; border-radius: 50%; background: var(--ion); }
.log li.live { color: var(--ion); font-weight: 800; }

/* Builder preview phone */
.pvcol { border-left: 1px solid var(--line); display: grid; justify-items: center; align-content: center; gap: 20px; position: relative;
  background: radial-gradient(400px 500px at 50% 55%, color-mix(in srgb, var(--b) 18%, transparent), transparent 70%), rgba(255,255,255,.4); }
.phone { width: 306px; height: 620px; border-radius: 50px; padding: 20px 15px 14px; background: #F7F7F4; color: var(--ink);
  box-shadow: 0 0 0 9px #111318, 0 0 0 10px #2A2D35, 0 50px 90px -30px rgba(11,12,16,.55); display: flex; flex-direction: column; gap: 10px; }
.st { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; padding: 0 10px; }
.badge { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: rgba(11,12,16,.07); }
.badge.live { background: var(--ion); color: #fff; }
.hd { display: flex; align-items: center; gap: 11px; padding: 2px 6px; }
.lg { width: 38px; height: 38px; border-radius: 12px; background: var(--b); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 18px; }
.hd b { font-size: 19px; letter-spacing: -0.02em; display: block; }
.hd small { font-size: 12px; color: var(--mu); }
.pc { padding: 13px 14px; border-radius: 18px; background: #fff; box-shadow: 0 1px 0 rgba(11,12,16,.04), 0 10px 24px -16px rgba(11,12,16,.3); display: grid; gap: 4px; }
.pc small { font-size: 12px; color: var(--mu); }
.pc b { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.pc em { font-style: normal; font-size: 12.5px; font-weight: 600; color: var(--b); }
.empty { flex: 1; display: grid; place-items: center; align-content: center; gap: 10px; text-align: center; color: var(--mu); padding: 0 16px; }
.empty b { font-size: 18px; color: var(--ink); }
.tabs { margin-top: auto; display: flex; justify-content: space-around; padding-top: 10px; border-top: 1px solid var(--line); }
.tabs span { display: grid; justify-items: center; gap: 4px; font-size: 11.5px; color: var(--mu); }
.tabs i { width: 20px; height: 20px; border-radius: 7px; background: rgba(11,12,16,.1); }
.tabs .on { color: var(--b); font-weight: 600; }
.tabs .on i { background: var(--b); }
.url { display: inline-flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 500; padding: 8px 16px; border-radius: 999px; background: #fff; box-shadow: var(--sh); }
.url i { width: 9px; height: 9px; border-radius: 50%; background: var(--ion); box-shadow: 0 0 10px var(--ion); }
.ring { position: absolute; left: 50%; top: 50%; width: 340px; height: 660px; margin: -350px 0 0 -170px; border-radius: 60px; border: 2px solid var(--b); pointer-events: none; opacity: 0; }

/* Marketplace */
.mk-top { display: flex; align-items: center; gap: 18px; padding: 20px 28px; border-bottom: 1px solid var(--line); background: #fff; }
.mk-search { flex: 1; height: 56px; border-radius: 999px; display: flex; align-items: center; gap: 12px; padding: 0 22px; background: #F4F4F1; box-shadow: inset 0 0 0 1.5px rgba(11,12,16,.08); font-size: 20px; }
.mk-search.focus { box-shadow: inset 0 0 0 2px var(--sig), 0 0 0 5px rgba(79,107,255,.14); background: #fff; }
.mk-search svg { width: 22px; height: 22px; color: var(--mu); }
.cartb { display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 20px; border-radius: 999px; background: #F4F4F1; font-size: 18px; font-weight: 600; }
.cartb b { min-width: 28px; height: 28px; border-radius: 999px; background: var(--sig); color: #fff; display: grid; place-items: center; font-size: 15px; }
.chips { display: flex; gap: 10px; padding: 18px 28px 0; }
.chips i { font-style: normal; padding: 10px 18px; border-radius: 999px; font-size: 16px; font-weight: 500; color: var(--mu); background: #fff; box-shadow: inset 0 0 0 1.5px rgba(11,12,16,.09); }
.chips i.on { background: var(--ink); color: #fff; box-shadow: none; }
.mk-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 16px 28px; }
.mkc { border-radius: 22px; background: #fff; box-shadow: var(--sh); overflow: hidden; visibility: hidden; position: relative; }
.mkc .art { height: 104px; display: grid; place-items: center; background: radial-gradient(80% 100% at 50% 0%, color-mix(in srgb, var(--h) 20%, transparent), transparent 75%), #F7F7F4; color: var(--h); }
.mkc .art svg { width: 54px; height: 54px; }
.mkc .bd { padding: 14px 16px 16px; display: grid; gap: 3px; }
.mkc small { font-size: 13px; color: var(--mu); display: flex; justify-content: space-between; }
.mkc small em { font-style: normal; color: var(--ion); font-weight: 700; }
.mkc b { font-size: 18px; font-weight: 650; letter-spacing: -0.015em; line-height: 1.25; }
.mkc .pr { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 17px; font-weight: 700; }
.mkc .pr span { font-size: 14px; font-weight: 700; padding: 7px 14px; border-radius: 999px; background: var(--ink); color: #fff; }
.mkc.is-added { box-shadow: 0 0 0 2.5px var(--ion), 0 30px 50px -28px rgba(19,168,139,.6); }
.mkc.is-added .pr span { background: var(--ion); }
.sellers { position: absolute; left: 160px; right: 160px; top: 1040px; }

/* How it works / many / e2e */
.steps3 { position: absolute; left: 160px; right: 160px; top: 380px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
.s3 { padding: 40px; border-radius: 30px; background: #fff; box-shadow: var(--sh); display: grid; gap: 18px; visibility: hidden; }
.s3 .n { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; font-weight: 700; background: rgba(11,12,16,.06); }
.s3.on .n { background: var(--sig); color: #fff; box-shadow: 0 0 0 8px rgba(79,107,255,.15); }
.s3 h3 { font-size: 42px; letter-spacing: -0.035em; font-weight: 700; line-height: 1.05; }
.s3 p { font-size: 22px; color: var(--mu); line-height: 1.4; }
.wall { position: absolute; left: 160px; right: 160px; top: 270px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
.uc { display: grid; grid-template-columns: 64px 1fr; gap: 18px; align-items: center; padding: 30px 26px; border-radius: 24px; visibility: hidden; background: #fff; box-shadow: var(--sh); }
.uc span { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: color-mix(in srgb, var(--h) 14%, transparent); color: var(--h); }
.uc span svg { width: 32px; height: 32px; }
.uc b { font-size: 24px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.15; }
.uc small { display: block; font-size: 16px; color: var(--mu); margin-top: 4px; font-weight: 500; }
.pipe { position: absolute; left: 160px; right: 160px; top: 430px; height: 180px; display: flex; justify-content: space-between; }
.pipe .line { position: absolute; left: 60px; right: 60px; top: 60px; height: 3px; background: linear-gradient(90deg, #4F6BFF, #13A88B 50%, #EE7433); opacity: .35; }
.pn { position: relative; width: 120px; display: grid; justify-items: center; align-content: start; gap: 16px; text-align: center; visibility: hidden; }
.pn i { width: 120px; height: 120px; border-radius: 34px; display: grid; place-items: center; background: #fff; box-shadow: var(--sh); }
.pn i svg { width: 52px; height: 52px; }
.pn b { font-size: 22px; font-weight: 650; white-space: nowrap; }
.pn.on i { box-shadow: 0 0 0 2.5px var(--ion), 0 24px 50px -20px rgba(19,168,139,.6); }
.pulse { position: absolute; top: 54px; width: 16px; height: 16px; border-radius: 50%; background: var(--ion); box-shadow: 0 0 0 6px rgba(19,168,139,.18), 0 0 30px var(--ion); }
.prods { position: absolute; left: 160px; right: 160px; top: 720px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.prods span { font-size: 20px; padding: 12px 22px; border-radius: 999px; background: #fff; box-shadow: var(--sh); visibility: hidden; }
