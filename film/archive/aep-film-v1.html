<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How the #8 AEP works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Source for the "How the #8 AEP works" film. Every frame is a pure function of time:
   seek(t) renders the frame at t seconds, so the film can be exported frame by frame. */
:root {
  --ob: #05060A; --ob2: #0B0D14; --ob3: #141722; --po: #F4F2EE; --gr: #8A8F9C;
  --sig: #5B7CFF; --ion: #5EE6C8; --emb: #FF8A4C; --line: rgba(255,255,255,.08);
  --b: #5B7CFF;
  --font: 'Inter Tight', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
body { font-family: var(--font); color: var(--po); -webkit-font-smoothing: antialiased; display: grid; place-items: center; }
#stage {
  position: relative; width: 1920px; height: 1080px; flex: none; overflow: hidden; transform-origin: center;
  background: radial-gradient(1200px 700px at 78% 30%, #0F1636 0%, transparent 60%), radial-gradient(900px 600px at 10% 90%, rgba(94,230,200,.08), transparent 60%), var(--ob);
}
.abs { position: absolute; }
svg { display: block; }

/* Intro & outro */
#intro, #outro { inset: 0; display: grid; place-items: center; align-content: center; text-align: center; gap: 28px; }
.logo { fill: var(--po); color: var(--po); }
#intro .logo { width: 150px; height: 128px; }
#intro h1 { font-size: 112px; line-height: .98; letter-spacing: -0.055em; font-weight: 700; }
#intro p, #outro p { font-size: 32px; color: var(--gr); letter-spacing: -0.01em; }
.grad { background: linear-gradient(100deg, #5B7CFF, #5EE6C8 50%, #FF8A4C); -webkit-background-clip: text; background-clip: text; color: transparent; }
#outro h2 { font-size: 124px; line-height: .98; letter-spacing: -0.055em; font-weight: 700; }
#outro .cta { display: inline-flex; align-items: center; gap: 14px; height: 84px; padding: 0 44px; border-radius: 999px; background: var(--sig); color: #fff; font-size: 30px; font-weight: 650; box-shadow: 0 24px 80px -16px rgba(91,124,255,.8); }
#outro .logo { width: 84px; height: 72px; margin-top: 18px; opacity: .9; }

/* Captions */
#cap { left: 160px; top: 64px; width: 1600px; display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
#capStep { font-size: 22px; font-weight: 600; color: var(--ion); margin-bottom: 10px; display: block; }
#capTitle { white-space: nowrap; font-size: 64px; line-height: 1; letter-spacing: -0.045em; font-weight: 700; }
#capSub { font-size: 25px; color: var(--gr); max-width: 760px; text-align: right; line-height: 1.35; }

/* App window */
#win { left: 160px; top: 236px; width: 1600px; height: 790px; border-radius: 30px; overflow: hidden;
  background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.012)), #090B12;
  box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 80px 160px -60px rgba(0,0,0,.95), 0 0 120px -40px rgba(91,124,255,.35); }
.bar { height: 58px; display: flex; align-items: center; gap: 9px; padding: 0 24px; border-bottom: 1px solid var(--line); font-size: 17px; }
.bar > i { width: 13px; height: 13px; border-radius: 50%; background: rgba(255,255,255,.14); }
.bar em { font-style: normal; color: var(--gr); margin-left: 14px; }
.bar b { margin-left: auto; font-size: 15px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,.06); color: var(--gr); }
.body { display: grid; grid-template-columns: 290px 1fr 420px; height: 732px; }
.rail { border-right: 1px solid var(--line); padding: 26px 18px; display: grid; align-content: start; gap: 6px; }
.rail li { list-style: none; display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: center; padding: 14px 12px; border-radius: 16px; color: var(--gr); }
.rail li span { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 600; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.18); }
.rail li b { font-size: 20px; font-weight: 600; }
.rail li.on { background: rgba(91,124,255,.13); color: var(--po); }
.rail li.on span { background: var(--sig); color: #fff; box-shadow: 0 0 0 5px rgba(91,124,255,.2); }
.rail li.done { color: var(--po); }
.rail li.done span { background: var(--ion); color: var(--ob); box-shadow: none; }
.main { position: relative; }
.panel { position: absolute; inset: 0; padding: 34px 38px; display: grid; align-content: start; gap: 18px; }
.ph { font-size: 34px; letter-spacing: -0.035em; font-weight: 650; }
.note { font-size: 19px; padding: 16px 20px; border-radius: 16px; background: rgba(91,124,255,.09); color: rgba(244,242,238,.85); }
.note b { color: var(--po); }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 54px; padding: 0 28px; border-radius: 999px; background: var(--sig); color: #fff; font-size: 19px; font-weight: 600; justify-self: start; }
.btn.light { background: var(--po); color: #0B0C10; }

/* Panel 0: business profile */
.inds { display: flex; flex-wrap: wrap; gap: 10px; }
.inds i { font-style: normal; padding: 12px 20px; border-radius: 999px; font-size: 18px; color: var(--gr); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.14); }
.inds i.on { background: var(--sig); color: #fff; box-shadow: 0 10px 30px -10px var(--sig); font-weight: 600; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.kpi { display: grid; gap: 6px; padding: 22px; border-radius: 20px; background: rgba(255,255,255,.035); box-shadow: inset 0 0 0 1px var(--line); }
.kpi span { font-size: 16px; color: var(--gr); font-weight: 600; }
.kpi b { font-size: 54px; font-weight: 700; letter-spacing: -0.045em; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi small { font-size: 15px; color: var(--gr); }
.kpi.hot { box-shadow: inset 0 0 0 1.5px rgba(91,124,255,.8), 0 20px 50px -30px var(--sig); background: rgba(91,124,255,.1); }
.empty { flex: 1; display: grid; place-items: center; align-content: center; gap: 12px; text-align: center; padding: 0 18px; color: var(--mu); }
.empty svg { width: 70px; height: 60px; fill: var(--fg); color: var(--fg); opacity: .25; }
.empty b { font-size: 19px; color: var(--fg); }
.empty small { font-size: 14px; line-height: 1.4; }

/* Panel 1: outcomes */
.ocg { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.oc { position: relative; display: grid; grid-template-columns: 52px 1fr; gap: 4px 16px; align-items: center; padding: 20px 56px 20px 20px; border-radius: 20px; background: rgba(255,255,255,.03); box-shadow: inset 0 0 0 1px var(--line); }
.oc .ic { grid-row: span 2; width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; background: rgba(255,255,255,.05); }
.oc .ic svg { width: 26px; height: 26px; }
.oc b { font-size: 19px; font-weight: 600; line-height: 1.25; }
.oc small { font-size: 15px; color: var(--gr); }
.oc .tick { position: absolute; top: 16px; right: 16px; width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.2); display: grid; place-items: center; }
.oc .tick svg { width: 15px; height: 15px; opacity: 0; }
.oc.on { background: rgba(91,124,255,.13); box-shadow: inset 0 0 0 1.5px rgba(91,124,255,.75); }
.oc.on .ic { background: var(--sig); }
.oc.on .tick { background: var(--sig); box-shadow: none; }
.oc.on .tick svg { opacity: 1; }
.tray { display: flex; gap: 10px; flex-wrap: wrap; padding: 18px; border-radius: 20px; background: rgba(255,255,255,.025); box-shadow: inset 0 0 0 1px var(--line); align-items: center; }
.tray > span { font-size: 16px; color: var(--gr); margin-right: 6px; }
.chip { display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px 9px 10px; border-radius: 999px; background: rgba(91,124,255,.15); box-shadow: inset 0 0 0 1px rgba(91,124,255,.45); font-size: 17px; font-weight: 500; }
.chip i { width: 26px; height: 26px; border-radius: 50%; background: var(--sig); display: grid; place-items: center; }
.chip i svg { width: 15px; height: 15px; }

/* Panel 2: blueprint */
.bp { display: grid; gap: 8px; }
.bp li { list-style: none; display: grid; grid-template-columns: 40px 1fr auto; gap: 16px; align-items: center; padding: 14px 20px; border-radius: 16px; background: rgba(255,255,255,.02); }
.bp li.on { background: rgba(255,255,255,.05); }
.bp .no { font-size: 15px; color: var(--gr); }
.bp b { font-size: 19px; font-weight: 600; color: var(--gr); }
.bp li.on b { color: var(--po); }
.bp em { font-style: normal; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: rgba(94,230,200,.12); color: var(--ion); margin-left: 10px; }
.sw { width: 56px; height: 32px; border-radius: 999px; background: rgba(255,255,255,.14); position: relative; }
.sw i { position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.4); }

/* Panel 3: devices */
.dv { display: grid; grid-template-columns: 128px 1fr auto; gap: 20px; align-items: center; padding: 16px; border-radius: 20px; background: rgba(255,255,255,.03); box-shadow: inset 0 0 0 1px var(--line); }
.dv .art { height: 92px; border-radius: 14px; display: grid; place-items: center; position: relative; }
.dv .art svg { width: 84%; height: 84%; }
.dv b { font-size: 21px; font-weight: 600; display: block; }
.dv small { display: block; font-size: 15px; color: var(--gr); margin-top: 4px; }
.dv .why { color: var(--ion); font-size: 15px; font-weight: 600; margin-top: 6px; display: block; }
.dv .q { font-size: 26px; font-weight: 650; padding: 10px 22px; border-radius: 999px; background: rgba(255,255,255,.06); font-variant-numeric: tabular-nums; }
.best { position: absolute; left: 8px; bottom: 8px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--ion); color: var(--ob); }
.ob { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.ob li { list-style: none; padding: 16px; border-radius: 16px; background: rgba(255,255,255,.03); display: grid; gap: 8px; }
.ob li i { width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(255,255,255,.22); display: grid; place-items: center; }
.ob li i svg { width: 16px; height: 16px; opacity: 0; }
.ob li b { font-size: 17px; font-weight: 600; }
.ob li em { font-style: normal; font-size: 15px; color: var(--ion); font-variant-numeric: tabular-nums; min-height: 20px; }
.ob li.done i { background: var(--ion); box-shadow: none; }
.ob li.done i svg { opacity: 1; }
.ob li.act { background: rgba(91,124,255,.12); }
.ob li.act i { box-shadow: none; border: 3px solid var(--sig); border-right-color: transparent; }
.obh { display: flex; align-items: center; justify-content: space-between; }
.obh span { font-size: 18px; color: var(--gr); font-weight: 600; }

/* Panel 4: workflows */
.wf { display: grid; gap: 14px; padding: 18px 22px; border-radius: 20px; background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px rgba(91,124,255,.35); }
.wf .top { display: flex; align-items: center; justify-content: space-between; }
.wf .tag { display: block; font-size: 14px; color: var(--ion); font-weight: 600; }
.wf .top b { font-size: 21px; font-weight: 600; }
.flow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.node { font-size: 16px; padding: 9px 15px; border-radius: 12px; background: rgba(255,255,255,.06); }
.node.t { background: rgba(255,138,76,.15); color: #FFC3A3; box-shadow: inset 0 0 0 1px rgba(255,138,76,.35); }
.node.lit { background: var(--sig); color: #fff; box-shadow: 0 0 30px -4px var(--sig); }
.node.t.lit { background: var(--emb); color: #fff; box-shadow: 0 0 30px -4px var(--emb); }
.arr { width: 20px; height: 2px; background: rgba(255,255,255,.3); }

/* Panel 5: brand */
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 28px; }
.f { display: grid; gap: 12px; }
.f > span { font-size: 16px; font-weight: 600; color: var(--gr); }
.inp { height: 58px; display: flex; align-items: center; padding: 0 20px; border-radius: 14px; border: 1.5px solid rgba(255,255,255,.16); background: rgba(255,255,255,.04); font-size: 21px; }
.inp.focus { border-color: var(--sig); }
.caret { display: inline-block; width: 2px; height: 26px; background: var(--po); margin-left: 2px; }
.sws { display: flex; gap: 12px; }
.sws i { width: 40px; height: 40px; border-radius: 50%; box-shadow: 0 0 0 3px #090B12, 0 0 0 4px transparent; }
.sws i.on { box-shadow: 0 0 0 3px #090B12, 0 0 0 5px currentColor; }
.seg { display: inline-flex; gap: 4px; padding: 5px; border-radius: 999px; background: rgba(255,255,255,.06); justify-self: start; }
.seg i { font-style: normal; padding: 11px 22px; border-radius: 999px; font-size: 17px; color: var(--gr); }
.seg i.on { background: var(--po); color: #0B0C10; font-weight: 600; }
.chips { display: flex; gap: 8px; }
.chips i { font-style: normal; padding: 10px 18px; border-radius: 999px; font-size: 17px; background: rgba(91,124,255,.16); box-shadow: inset 0 0 0 1px rgba(91,124,255,.6); }

/* Panel 6: go live */
.dns { display: grid; gap: 14px; padding: 20px; border-radius: 20px; background: rgba(255,255,255,.03); box-shadow: inset 0 0 0 1px var(--line); }
.dns code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 18px; padding: 14px 16px; border-radius: 12px; background: #06070B; box-shadow: inset 0 0 0 1px var(--line); }
.dns code b { color: var(--ion); margin-right: 12px; }
.ok { display: flex; align-items: center; gap: 10px; color: var(--ion); font-weight: 600; font-size: 19px; }
.ok svg { width: 22px; height: 22px; }
.spin { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--sig); border-right-color: transparent; }
.log { display: grid; gap: 12px; padding: 22px; border-radius: 20px; background: #06070B; box-shadow: inset 0 0 0 1px var(--line); font-size: 19px; }
.log li { list-style: none; display: flex; align-items: center; gap: 14px; }
.log li i { width: 18px; height: 18px; border-radius: 50%; background: var(--ion); }
.log li.live { color: var(--ion); font-weight: 700; }

/* Preview phone */
.pvcol { border-left: 1px solid var(--line); display: grid; justify-items: center; align-content: center; gap: 22px; position: relative;
  background: radial-gradient(420px 520px at 50% 55%, color-mix(in srgb, var(--b) 24%, transparent), transparent 70%); }
.phone { --bg: #07080D; --fg: #F4F2EE; --card: #131620; --mu: #8A8F9C;
  width: 316px; height: 640px; border-radius: 50px; padding: 20px 16px 14px; background: var(--bg); color: var(--fg);
  box-shadow: 0 0 0 1px rgba(255,255,255,.16), inset 0 0 0 7px #000, inset 0 0 0 8px rgba(255,255,255,.08), 0 50px 90px -30px rgba(0,0,0,.95);
  display: flex; flex-direction: column; gap: 11px; }
.phone.light { --bg: #F6F5F1; --fg: #0B0C10; --card: #fff; --mu: #6B7080; }
.st { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; padding: 0 10px; }
.badge { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: color-mix(in srgb, var(--fg) 10%, transparent); }
.badge.live { background: var(--ion); color: #05060A; }
.hd { display: flex; align-items: center; gap: 11px; padding: 2px 6px; }
.lg { width: 38px; height: 38px; border-radius: 12px; background: var(--b); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 18px; }
.hd b { font-size: 19px; letter-spacing: -0.02em; display: block; }
.hd small { font-size: 12px; color: var(--mu); }
.card { padding: 14px 15px; border-radius: 20px; background: var(--card); display: grid; gap: 5px; }
.card small { font-size: 12px; color: var(--mu); }
.read b { font-size: 40px; font-weight: 650; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.read b span { font-size: 17px; color: var(--mu); margin-left: 3px; font-weight: 500; }
.read em { font-style: normal; font-size: 13px; font-weight: 600; color: var(--b); }
.read.alert { box-shadow: inset 0 0 0 2px var(--emb); }
.read.alert b, .read.alert em { color: var(--emb); }
.row { display: flex; justify-content: space-between; font-size: 14px; padding: 12px 15px; border-radius: 16px; background: var(--card); }
.row b { color: var(--b); }
.bar2 { height: 6px; border-radius: 6px; background: color-mix(in srgb, var(--fg) 10%, transparent); overflow: hidden; }
.bar2 i { display: block; height: 100%; background: var(--b); border-radius: inherit; }
.devs b { font-size: 17px; }
.bars { display: flex; align-items: end; gap: 7px; height: 66px; padding: 4px 6px 0; }
.bars span { flex: 1; border-radius: 5px; background: linear-gradient(var(--b), color-mix(in srgb, var(--b) 20%, transparent)); }
.tabs { margin-top: auto; display: flex; justify-content: space-around; padding-top: 10px; border-top: 1px solid color-mix(in srgb, var(--fg) 8%, transparent); }
.tabs span { display: grid; justify-items: center; gap: 4px; font-size: 11.5px; color: var(--mu); }
.tabs i { width: 20px; height: 20px; border-radius: 7px; background: color-mix(in srgb, var(--fg) 14%, transparent); }
.tabs .on { color: var(--b); font-weight: 600; }
.tabs .on i { background: var(--b); }
.url { display: inline-flex; align-items: center; gap: 10px; font-size: 16px; padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,.06); }
.url i { width: 9px; height: 9px; border-radius: 50%; background: var(--ion); box-shadow: 0 0 12px var(--ion); }
.ring { position: absolute; left: 50%; top: 50%; width: 360px; height: 680px; margin: -360px 0 0 -180px; border-radius: 60px; border: 2px solid var(--b); pointer-events: none; }

/* Cursor */
#cursor { width: 34px; height: 34px; left: 0; top: 0; z-index: 10; filter: drop-shadow(0 6px 10px rgba(0,0,0,.6)); }
#click { width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 3px solid rgba(255,255,255,.85); z-index: 9; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 96 82">
    <polygon points="31,18 41,18 25,80 15,80"/><polygon points="53,18 63,18 47,80 37,80"/>
    <polygon points="10,32 72,32 69.5,42 7.5,42"/><polygon points="4,56 66,56 63.5,66 1.5,66"/>
    <g fill="none" stroke="currentColor" stroke-width="2.2"><ellipse cx="84" cy="7.6" rx="5.6" ry="5.2"/><ellipse cx="84" cy="19.6" rx="6.8" ry="6.6"/></g>
  </symbol>
  <symbol id="ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div id="stage">
  <div id="intro" class="abs">
    <svg class="logo"><use href="#logo"/></svg>
    <h1>How the #8 AEP works</h1>
    <p>From the outcome you want to a live IoT application. No code.</p>
  </div>

  <div id="cap" class="abs">
    <div><span id="capStep"></span><h2 id="capTitle"></h2></div>
    <p id="capSub"></p>
  </div>

  <div id="win" class="abs">
    <div class="bar"><i></i><i></i><i></i><em>#8 AEP · Outcome Studio</em><b id="status">Draft</b></div>
    <div class="body">
      <ol class="rail" id="rail"></ol>
      <div class="main" id="main"></div>
      <div class="pvcol" id="pvcol">
        <span class="ring" id="ring"></span>
        <div class="phone" id="phone"></div>
        <span class="url" id="url"></span>
      </div>
    </div>
  </div>

  <div id="outro" class="abs">
    <h2>Your outcome.<br><span class="grad">Live this week.</span></h2>
    <p>Build it yourself in the #8 AEP. No code, free sandbox.</p>
    <div><span class="cta">Start free in the #8 AEP</span></div>
    <svg class="logo"><use href="#logo"/></svg>
  </div>

  <div id="click" class="abs"></div>
  <svg id="cursor" class="abs" viewBox="0 0 24 24"><path d="M4 2.5l15 9.2-6.6 1.5 3.6 7.1-2.9 1.4-3.5-7.2-5 4.3z" fill="#fff" stroke="#05060A" stroke-width="1.3" stroke-linejoin="round"/></svg>
</div>

<script>
(function () {
  'use strict';
  var DURATION = 81;
  var OFF = 9; // the business chapter runs before the outcome flow
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };

  /* ---------- timing helpers ---------- */
  function clamp(x) { return Math.max(0, Math.min(1, x)); }
  function seg(t, a, b) { return clamp((t - a) / (b - a)); }
  function eo(x) { return 1 - Math.pow(1 - x, 3); }              // ease-out
  function eio(x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; } // ease-in-out
  function vis(el, t, a, b, fadeIn, fadeOut, rise) {
    fadeIn = fadeIn || .5; fadeOut = fadeOut || .4; rise = rise == null ? 24 : rise;
    var o = Math.min(eo(seg(t, a, a + fadeIn)), 1 - seg(t, b - fadeOut, b));
    el.style.opacity = o;
    el.style.transform = 'translateY(' + ((1 - eo(seg(t, a, a + fadeIn))) * rise) + 'px)';
    el.style.visibility = o > .001 ? 'visible' : 'hidden';

    var pressed = CLICKS.some(function (c) { return t >= c && t < c + .18; });
    cur.style.transform = 'translate(' + (pos.x - 6) + 'px,' + (pos.y - 4) + 'px) scale(' + (pressed ? .85 : 1) + ')';
    var lastClick = CLICKS.filter(function (c) { return c <= t; }).pop();
    var ck = lastClick != null ? seg(t, lastClick, lastClick + .55) : 1;
    clk.style.opacity = ck < 1 ? (1 - ck) * .9 * cO : 0;
    clk.style.transform = 'translate(' + pos.x + 'px,' + pos.y + 'px) scale(' + (.3 + ck * .9) + ')';
  }

  /* ---------- playback ---------- */
  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    $('#stage').style.transform = 'scale(' + s + ')';
  }
  window.seek = function (t) { render(Math.max(0, Math.min(DURATION, t))); };
  window.FILM_DURATION = DURATION;
  var capture = /capture/.test(location.search);
  if (!capture) {
    fit(); window.addEventListener('resize', fit);
    var t0 = null;
    var loop = function (now) {
      if (t0 === null) t0 = now;
      render(((now - t0) / 1000) % DURATION);
      requestAnimationFrame(loop);
    };
    document.fonts.ready.then(function () { requestAnimationFrame(loop); });
  } else {
    document.fonts.ready.then(function () { render(0); window.FILM_READY = true; });
  }
})();
</script>
</body>
