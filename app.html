<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>#8 Console</title>
  <meta name="description" content="Open a #8 IoT application.">
  <meta name="theme-color" content="#05060A">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="gate">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="logo" viewBox="0 0 96 82">
      <polygon points="31,18 41,18 25,80 15,80"/>
      <polygon points="53,18 63,18 47,80 37,80"/>
      <polygon points="10,32 72,32 69.5,42 7.5,42"/>
      <polygon points="4,56 66,56 63.5,66 1.5,66"/>
      <g fill="none" stroke="currentColor" stroke-width="2.2">
        <ellipse cx="84" cy="7.6" rx="5.6" ry="5.2"/>
        <ellipse cx="84" cy="19.6" rx="6.8" ry="6.6"/>
      </g>
    </symbol>
  </svg>

  <header class="gate__nav">
    <a href="index.html" class="brand" aria-label="#8 home"><svg class="logo" aria-hidden="true"><use href="#logo"/></svg></a>
    <a href="index.html#products" class="link-quiet">All products</a>
  </header>

  <main class="gate__main">
    <canvas class="gate__canvas" id="gateCanvas" aria-hidden="true"></canvas>

    <section class="gate__card" id="gateCard" aria-live="polite">
      <!-- filled by app.js -->
    </section>

    <nav class="gate__switch" aria-label="Switch application">
      <p>Switch application</p>
      <ul id="gateList"></ul>
    </nav>
  </main>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/hero.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
